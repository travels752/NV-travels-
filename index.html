<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NV Travels</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>NV Travels</h1>
    <p>Travel • Taxi • Hotel Booking</p>
  </header>

  <main>

    <h2>🚕 Book a Ride</h2>

    <input type="text" id="pickup" placeholder="Pickup Location">

    <input type="text" id="drop" placeholder="Drop Location">

    <input type="date" id="date">

    <input type="time" id="time">

    <button onclick="bookRide()">🚕 Book Ride</button>

    <p id="bookingMessage"></p>

    <hr>

    <button>🏨 Hotel Booking</button>
    <<section id="customerLogin">
  <h2>👤 Customer Login</h2>

  <input type="text" id="customerName" placeholder="Your Name">

  <input type="tel" id="customerPhone" placeholder="Mobile Number">

  <input type="password" id="customerPassword" placeholder="Password">

  <button onclick="customerLogin()">Login</button>

  <p id="loginMessage"></p>
    </section>
    <button>👨‍✈️ Driver Login</button>
    <button>📞 Contact NV Travels</button>

  </main>

  <footer>
    <p>© 2026 NV Travels</p>
  </footer>

  <script src="script.js"></script>

</body>
</html>
