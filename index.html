<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NV Travels</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🚕 NV Travels</h1>
  <p>Taxi • Driver • Hotel • Travel</p>
</header>

<main>

  <!-- CUSTOMER RIDE -->
  <section class="card">
    <h2>🚕 Book a Ride</h2>

    <input type="text" id="pickup" placeholder="Pickup Location">

    <input type="text" id="drop" placeholder="Drop Location">

    <input type="date" id="date">

    <input type="time" id="time">

    <select id="vehicle">
      <option value="">Select Vehicle</option>
      <option>Car</option>
      <option>SUV</option>
      <option>Taxi</option>
      <option>Tempo Traveller</option>
    </select>

    <button onclick="bookRide()">🚕 Book Ride</button>

    <p id="rideMessage"></p>
  </section>


  <!-- HOTEL -->
  <section class="card">
    <h2>🏨 Hotel Booking</h2>

    <p>क्या आपको hotel book करनी है?</p>

    <input type="text" id="hotelCity" placeholder="Enter City">

    <input type="date" id="checkin">

    <input type="date" id="checkout">

    <button onclick="bookHotel()">🏨 Book Hotel</button>

    <button onclick="skipHotel()" style="margin-top:10px;">
      ⏭️ Skip Hotel Booking
    </button>

    <p id="hotelMessage"></p>
  </section>


  <!-- CUSTOMER ACCOUNT -->
  <section class="card">
    <h2>👤 Customer Account</h2>

    <input type="text" id="userName" placeholder="Your Name">

    <input type="tel" id="userMobile" placeholder="Mobile Number">

    <input type="password" id="userPassword" placeholder="Password">

    <button onclick="registerUser()">🆕 Create Account</button>

    <button onclick="loginUser()" style="margin-top:10px;">
      🔐 Login
    </button>

    <button onclick="logoutUser()" style="margin-top:10px;">
      🚪 Logout
    </button>

    <p id="accountMessage"></p>
  </section>


  <!-- DRIVER -->
  <section class="card">
    <h2>🚗 Driver Account</h2>

    <input type="text" id="driverName" placeholder="Driver Name">

    <input type="tel" id="driverMobile" placeholder="Mobile Number">

    <input type="password" id="driverPassword" placeholder="Password">

    <select id="driverVehicle">
      <option value="">Select Vehicle</option>
      <option>Car</option>
      <option>SUV</option>
      <option>Taxi</option>
      <option>Tempo Traveller</option>
    </select>

    <input type="text" id="vehicleNumber" placeholder="Vehicle Number">

    <button onclick="registerDriver()">🆕 Driver Registration</button>

    <button onclick="loginDriver()" style="margin-top:10px;">
      🔐 Driver Login
    </button>

    <button onclick="logoutDriver()" style="margin-top:10px;">
      🚪 Driver Logout
    </button>

    <p id="driverMessage"></p>
  </section>


  <!-- DRIVER RIDE REQUESTS -->
  <section class="card">
    <h2>📋 Available Ride Requests</h2>

    <div id="rideRequests">
      <p>अभी कोई ride request नहीं है।</p>
    </div>

    <button onclick="refreshRides()" style="margin-top:10px;">
      🔄 Refresh Rides
    </button>
  </section>


  <!-- SOCIAL -->
  <section class="card">
    <h2>📱 NV Travels Social</h2>

    <p>Travel posts और videos share करें।</p>

    <button onclick="social()">📱 Open Social</button>

    <p id="socialMessage"></p>
  </section>

</main>


<footer>
  <p>© 2026 NV Travels</p>
  <p>📞 9098533390</p>
</footer>

<script src="script.js"></script>

</body>
</html>
